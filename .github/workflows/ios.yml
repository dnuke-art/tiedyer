name: iOS TestFlight

# Builds the Capacitor iOS shell around the web app and uploads it to TestFlight
# on a release tag (macOS runners are expensive, so not on every push), plus
# manual dispatch. The build number is the Unix epoch so it is always the latest.
#
#   git tag ios-v0.1.0 && git push origin ios-v0.1.0   →  builds & uploads
#
on:
  push:
    tags:
      - 'ios-v*'
  # manual run; `version` sets the marketing version, e.g. to match the version record
  # App Store Connect has open (a build is only offered to a version with its number)
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (x.y.z); empty = from the tag, else 0.1'
        required: false
        default: ''

jobs:
  build-and-upload:
    # macos-26 ships Xcode 26 (iOS 26 SDK) — App Store Connect rejects
    # uploads built with anything older.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Select latest Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same Vite build as the website, minus the analytics tag (--mode native),
      # copied into ios/App/App/public by `cap sync`. The Capacitor runtime and
      # plugins resolve as Swift packages during the archive.
      - name: Build web assets into the iOS project
        run: |
          npm ci
          npm run build:ios

      # Marketing version (x.y.z) from the tag (ios-v0.1.0 → 0.1.0), else the
      # project default. Build number = Unix epoch seconds: always large and
      # monotonically increasing, so an older manual upload can never outrank it.
      - name: Compute version + build number
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$REF" == ios-v* ]]; then
            VERSION="${REF#ios-v}"
          else
            VERSION="0.1"
          fi
          BUILD=$(date -u +%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (+$BUILD)"

      # The App Store Connect API key drives the provisioning profile fetch and
      # the TestFlight upload. Same secret names as the other repos' iOS workflows.
      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

      # Persistent Apple Distribution + Development certificates. Without both in
      # a keychain, -allowProvisioningUpdates mints a new cloud-managed cert on
      # every (ephemeral) runner and the team hits Apple's cert cap after a
      # handful of builds. With the .p12s imported, automatic signing finds these
      # identities and reuses them; the API key still fetches the profile.
      - name: Import signing certificates  # BOTH identities — dist alone still mints dev certs (team-wide cap)
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          DEV_P12_B64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          DEV_P12_PASS: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] && [ -z "$DEV_P12_B64" ]; then
            echo "No persistent cert secrets set — falling back to cloud-managed signing"
            exit 0
          fi
          KC="$RUNNER_TEMP/ci-signing.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          import_p12() { # $1=base64 $2=password $3=label
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/$3.p12"
            security import "$RUNNER_TEMP/$3.p12" -k "$KC" -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
            rm -f "$RUNNER_TEMP/$3.p12"
            echo "imported $3 identity"
          }
          [ -n "$P12_B64" ]     && import_p12 "$P12_B64"     "$P12_PASS"     dist
          [ -n "$DEV_P12_B64" ] && import_p12 "$DEV_P12_B64" "$DEV_P12_PASS" dev
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -archivePath build/App.xcarchive archive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=W527ZN3X52 \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }}

      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ExportOptionsCI.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Clean up key + keychain
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
